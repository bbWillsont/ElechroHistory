<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ЭлектроМонтаж — пульт мастера</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23f6c445'/><path d='M13 3 5.5 13.5h5L9.5 21 18 10.5h-5L13 3z' fill='%2317181d'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1013; --shell:#17181d; --side:#1b1d22; --card:#1d1f25; --card2:#22242b; --field:#14161a;
  --line:#2a2d35; --line2:#383c46;
  --ink:#f4f5f7; --mut:#a0a6b1; --dim:#6d7380;
  --yel:#f6c445; --yel2:#ffd975; --yelT:#ffd975; --ydim:rgba(246,196,69,.13);
  --green:#4ade80; --red:#ff6b5e; --blue:#5aa7ff;
  --bordo:#8e2f3c; --bordo-d:#6d2430; --del:#b04352;
  --mtop:rgba(23,24,29,.96); --mnavbg:#17181d; --docwrapbg:#101114;
  --disp:'Unbounded',sans-serif; --body:'Golos Text',sans-serif; --mono:'JetBrains Mono',monospace;
  --sh:0 14px 34px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#eef1f5; --shell:#ffffff; --side:#fbfcfe; --card:#ffffff; --card2:#eef1f5; --field:#f7f8fa;
  --line:#e3e7ee; --line2:#c9d1dc;
  --ink:#1a2438; --mut:#5b6472; --dim:#8a93a3;
  --yelT:#8a6a00; --ydim:rgba(246,196,69,.2);
  --green:#1d8a54; --red:#d43d2a; --blue:#2559d3;
  --bordo:#8e2f3c; --bordo-d:#6d2430; --del:#a03340;
  --mtop:rgba(255,255,255,.94); --mnavbg:#ffffff; --docwrapbg:#e7ebf1;
  --sh:0 14px 34px rgba(30,40,60,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;min-height:100vh;padding:18px;overflow-x:hidden}
body.modal-open{overflow:hidden}
body.modal-open .mnav{display:none!important}
::selection{background:rgba(246,196,69,.3)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--shell);border-radius:8px}
.app{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:252px 1fr;background:var(--shell);
  border:1px solid var(--line);border-radius:24px;overflow:hidden;min-height:calc(100vh - 36px)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px 16px}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 20px;min-width:0}
.brand-ic{width:40px;height:40px;border-radius:12px;background:var(--yel);display:grid;place-items:center;box-shadow:0 6px 18px rgba(246,196,69,.28);flex:none}
.brand-ic svg{width:20px;height:20px;fill:#17181d}
.brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;background:transparent;border-radius:12px;
  color:var(--mut);font-size:14px;font-weight:500;text-align:left;transition:.16s}
.nav-btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--card2);color:var(--ink)}
.nav-btn.active{background:var(--ydim);color:var(--yelT)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:1px 8px;border-radius:20px;background:var(--card2);color:var(--dim)}
.nav-btn.active .nav-badge{background:rgba(246,196,69,.18);color:var(--yelT)}
.side-sp{flex:1}
.plan{background:rgba(246,196,69,.08);border:1px solid rgba(246,196,69,.25);border-radius:14px;padding:14px;margin-bottom:12px}
.plan .t{font-size:12.5px;font-weight:600}
.plan .s{font-size:11px;color:var(--dim);margin:2px 0 10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),var(--yel2));border-radius:99px;transition:width .6s ease}
.plan .pct{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;text-align:right}
.plan .btn{width:100%;margin-top:10px;justify-content:center}
.user{display:flex;align-items:center;gap:11px;padding:10px 8px 2px;border-top:1px solid var(--line);cursor:pointer;transition:.15s;border-radius:10px}
.user:hover{background:var(--card2)}
.user .ava{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;
  font-family:var(--disp);font-size:13px;color:var(--yelT)}
.user .nm{font-size:13px;font-weight:600}
.user .rl{font-size:11px;color:var(--dim)}
.user .ch{margin-left:auto;color:var(--dim)}
.mtop{display:contents}
.mhead{display:none;align-items:center;gap:8px;padding:10px 12px}
.mhead .brand{padding:0;flex:1;min-width:0}
.mhead .brand b{font-size:14px}
.icrow{display:flex;gap:6px;flex:none;align-items:center}
.mclock{font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  padding:5px 8px;border-radius:999px;white-space:nowrap;flex:none}
.clockchip{font-family:var(--mono);font-size:11.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);
  padding:9px 14px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center}
.mnav{display:none}
.mn-b{position:absolute;top:4px;left:calc(50% + 5px);font-style:normal;font-family:var(--mono);font-size:8.5px;
  background:var(--red);color:#fff;border-radius:9px;padding:0 4px;min-width:13px;text-align:center;line-height:1.6}
main{padding:26px 28px 40px;min-width:0;max-width:100%}
.view{display:none;min-width:0;max-width:100%}
.view.active{display:block;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.greet{display:flex;align-items:flex-start;gap:14px;margin-top:10px;margin-bottom:16px;min-width:0}
.greet>div:first-child{min-width:0}
.greet h1{font-family:var(--disp);font-weight:600;font-size:22px;overflow-wrap:break-word}
.greet p{color:var(--dim);font-size:13px;margin-top:5px}
.greet .ic{margin-left:auto;display:flex;gap:8px;flex:none}
.icbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:.15s;color:var(--mut)}
.icbtn:hover{border-color:var(--yel);color:var(--yelT)}
.icbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{display:none}
.switch .track{position:absolute;inset:0;background:#3a3f4a;border-radius:16px;transition:.25s;cursor:pointer}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.25s}
.switch input:checked+.track{background:var(--yel)}
.switch input:checked+.track::after{left:22px}
html[data-theme="light"] .switch .track{background:#d5d9e0}
#menu{position:fixed;top:64px;right:20px;z-index:70;background:var(--card);border:1px solid var(--line2);border-radius:14px;
  box-shadow:var(--sh);min-width:230px;padding:6px;display:none}
#menu.on{display:block}
#menu button{display:flex;width:100%;gap:9px;align-items:center;border:none;background:none;padding:10px 12px;border-radius:9px;font-size:13px;color:var(--mut)}
#menu button:hover{background:var(--card2);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;transition:.18s;animation:rise .35s ease both;min-width:0}
.stat:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sh)}
.stat .ic{width:46px;height:46px;flex:none;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.stat .ic svg{width:21px;height:21px;stroke:var(--yel);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stat .ic.b svg{stroke:var(--blue)} .stat .ic.g svg{stroke:var(--green)} .stat .ic.m svg{stroke:var(--mut)} .stat .ic.r svg{stroke:var(--red)}
.stat .ic.r{background:rgba(255,107,94,.12)}
.stat .ic.g{background:rgba(74,222,128,.12)}
.stat>div:last-child{min-width:0}
.stat .lb{font-size:12px;color:var(--dim)}
.stat .vl{font-family:var(--disp);font-weight:600;font-size:21px;line-height:1.25;overflow-wrap:anywhere}
.stat .dl{font-size:11px;color:var(--dim)} .stat .dl.up{color:var(--green)}
.grid2{display:grid;gap:14px;margin-top:14px}
.ga{grid-template-columns:1.25fr .9fr}.gb{grid-template-columns:.95fr 1.15fr}.gc{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;animation:rise .4s ease both;min-width:0;max-width:100%}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card-h b{font-size:15px;font-weight:600}
.link{border:none;background:none;color:var(--dim);font-size:12.5px;transition:.15s}
.link:hover{color:var(--yelT)}
.plist{display:flex;flex-direction:column;gap:6px;min-width:0}
.pitem{display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:12px;transition:.15s;cursor:pointer;min-width:0}
.pitem:hover{background:var(--card2)}
.pitem .ic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mut)}
.pitem .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pitem .mid{flex:1;min-width:0}
.pitem .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .sb{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .sum{margin-left:auto;font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--yelT);white-space:nowrap;flex:none}
.pitem .go{color:var(--dim);font-size:18px;transition:.15s;flex:none}
.pitem:hover .go{color:var(--yelT);transform:translateX(3px)}
.qform label{display:block;font-size:11.5px;color:var(--dim);margin:0 0 5px}
.qform .row{margin-bottom:12px}
.qres{margin-top:14px;border:1px dashed var(--line2);border-radius:12px;padding:13px 14px;display:none}
.qres.on{display:block;animation:rise .3s ease}
.qres .r{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut);padding:3px 0}
.qres .r b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.qres .tot{border-top:1px solid var(--line);margin-top:8px;padding-top:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.qres .tot b{font-family:var(--disp);font-size:16px;color:var(--yelT)}
.donutwrap{display:flex;gap:22px;align-items:center;min-width:0}
.donut{width:158px;height:158px;transform:rotate(-90deg);flex:none}
.dlegend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.dlegend .r{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mut);min-width:0}
.dlegend .r .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dlegend .r b{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--ink)}
.fin-tot{display:flex;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;flex-wrap:wrap;gap:10px}
.fin-tot.no-line{border-top:none;margin-top:0;padding-top:0}
.fin-tot div{flex:1;min-width:0}
.fin-tot .k{font-size:11.5px;color:var(--dim)}
.fin-tot .v{font-family:var(--mono);font-weight:600;font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.fin-tot .pf{background:var(--ydim);border:1px solid rgba(246,196,69,.35);border-radius:10px;padding:8px 12px;margin-left:12px}
.fin-tot .pf .v{color:var(--yelT)}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:6px}
.exp-hero{display:flex;align-items:baseline;gap:10px;padding:2px 2px 14px;flex-wrap:wrap}
.exp-hero .sum{font-family:var(--disp);font-weight:600;font-size:26px;color:var(--red)}
.exp-hero .sub{font-size:11.5px;color:var(--dim)}
.exp-rows{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.exp-row{display:flex;align-items:center;gap:10px}
.exp-row .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.exp-row .nm{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-row .amt{font-family:var(--mono);font-weight:600;color:var(--red)}
.exp-empty{display:flex;gap:12px;align-items:center;width:100%;background:var(--field);border:1px dashed var(--line2);border-radius:12px;padding:14px;color:var(--dim);font-size:12.5px}
.exp-empty .e-ic{font-size:22px;flex:none}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph-item{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.ph-item img{width:100%;height:92px;object-fit:cover;display:block}
.ph-tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
.ph-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
.doc-photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.doc-photos img{width:170px;height:115px;object-fit:cover;border:1px solid #999;border-radius:4px}
.task{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer;transition:.13s;min-width:0}
.task:hover{background:var(--card2)}
.task input{display:none}
.task .box{width:18px;height:18px;flex:none;border:1.5px solid var(--line2);border-radius:5px;display:grid;place-items:center;transition:.15s;font-size:11px;color:#17181d}
.task input:checked+.box{background:var(--yel);border-color:var(--yel)}
.task input:checked+.box::after{content:"✓";font-weight:800}
.task input:checked~.tnm{color:var(--dim);text-decoration:line-through}
.task .tnm{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .chip{flex:none}
.task .src{font-size:11px;color:var(--dim);width:150px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.noti{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;min-width:0}
.noti .dot{margin-top:5px;flex:none}
.noti>div{min-width:0;flex:1}
.noti .t{font-size:13px;font-weight:600;overflow-wrap:break-word}
.noti .s{font-size:11.5px;color:var(--dim);overflow-wrap:break-word}
.noti .w{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;font-weight:600;font-size:13.5px;
  padding:10px 18px;background:var(--card2);color:var(--ink);transition:.16s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-amber{background:var(--yel);color:#17181d;box-shadow:0 6px 18px rgba(246,196,69,.25)}
.btn-ghost{background:var(--card2);border:1px solid var(--line)}
.btn-cyan{background:rgba(90,167,255,.12);color:var(--blue)}
.btn-red{background:rgba(255,107,94,.12);color:var(--red)}
.btn-bordo{background:var(--bordo);color:#fff;border:1px solid var(--bordo-d);box-shadow:0 6px 16px rgba(142,47,60,.35)}
.btn-bordo:hover{filter:brightness(1.12)}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px}
.btn-mini{padding:5px 10px;font-size:11.5px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.btn-mini:hover{color:var(--ink);border-color:var(--line2)}
.btn-mini.ok{color:var(--green);border-color:rgba(74,222,128,.45)}
.btn-mini.ok:hover{color:var(--green);border-color:var(--green)}
.del-txt{background:none;border:none;color:var(--del);font-size:11.5px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:6px}
.del-txt:hover{text-decoration:underline;filter:brightness(1.15)}
.icon-e{width:28px;height:28px;border-radius:8px;border:none;background:transparent;font-size:15px;color:var(--dim);transition:.14s}
.icon-e:hover{background:rgba(90,167,255,.14);color:var(--blue)}
.inp{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;outline:none;transition:.15s;width:100%;max-width:100%}
.inp:focus{border-color:var(--yel);box-shadow:0 0 0 3px rgba(246,196,69,.15)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238a93a3' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
textarea.inp{resize:vertical;min-height:64px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mut);padding:4px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--yel)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 10px;border-radius:8px;white-space:nowrap}
.chip-green{background:rgba(74,222,128,.12);color:var(--green)}
.chip-amber{background:var(--ydim);color:var(--yelT)}
.chip-cyan{background:rgba(90,167,255,.12);color:var(--blue)}
.chip-red{background:rgba(255,107,94,.12);color:var(--red)}
.chip-muted{background:var(--card2);color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.mono{font-family:var(--mono)}
.amber{color:var(--yelT)}
.empty{border:1px dashed var(--line2);border-radius:16px;padding:46px 24px;text-align:center;color:var(--mut);background:var(--card)}
.empty b{display:block;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.view>.toolbar:first-child{margin-top:6px}
.toolbar .inp{width:auto}
.tabs{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;max-width:100%;overflow-x:auto}
.tabs button{border:none;background:transparent;color:var(--mut);font-weight:600;font-size:12.5px;padding:8px 16px;border-radius:9px;transition:.15s;white-space:nowrap}
.tabs button.active{background:var(--yel);color:#17181d}
.tabs button:not(.active):hover{color:var(--ink)}
.siteline{font-size:12.5px;color:var(--dim);margin:-6px 0 14px;overflow-wrap:break-word}
.kbanne{display:flex;gap:10px;align-items:flex-start;background:rgba(90,167,255,.08);border:1px solid rgba(90,167,255,.3);
  border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--blue);margin-top:10px}
.kbanne.none{background:var(--card2);border-color:var(--line);color:var(--mut)}

function fnum(n){ return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(+n||0); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtD(iso){ if(!iso)return "—"; var p=String(iso).split("-"); return p.length===3?(p[2]+"."+p[1]+"."+p[0]):String(iso); }
function today(){ return new Date().toISOString().slice(0,10); }
function relTime(iso){ if(!iso)return ""; var d=new Date(iso+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);
  var diff=Math.round((n-d)/864e5);
  if(diff<=0)return "сегодня"; if(diff===1)return "вчера"; if(diff<7)return diff+" дн. назад"; return fmtD(iso); }
function normNums(s){ return String(s||"").replace(/(^|\n)(\d+)\)\s/g,"$1$2. "); }
function plural(n,one,few,many){
  var n10=n%10,n100=n%100;
  if(n100>=11&&n100<=14)return many;
  if(n10===1)return one;
  if(n10>=2&&n10<=4)return few;
  return many;
}
function translit(s){
  var m={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
  return String(s||"").toLowerCase().split("").map(function(c){ return m[c]!==undefined?m[c]:c; }).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"dokument";
}
function tri(x,fem){
  var units=["","один","два","три","четыре","пять","шесть","семь","восемь","девять"];
  var unitsF=["","одна","две","три","четыре","пять","шесть","семь","восемь","девять"];
  var teens=["десять","одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать"];
  var tens=["","","двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"];
  var hundreds=["","сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];
  var s="",h=Math.floor(x/100),rest=x%100;
  if(h)s+=hundreds[h]+" ";
  if(rest>=10&&rest<20)s+=teens[rest-10]+" ";
  else{
    var d=Math.floor(rest/10),u=rest%10;
    if(d)s+=tens[d]+" ";
    if(u)s+=(fem?unitsF[u]:units[u])+" ";
  }
  return s;
}
function numToWordsRu(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return "Ноль";
  var s="";
  var mln=Math.floor(n/1000000), th=Math.floor((n%1000000)/1000), rest=n%1000;
  if(mln)s+=tri(mln,false)+plural(mln,"миллион ","миллиона ","миллионов ");
  if(th)s+=tri(th,true)+plural(th,"тысяча ","тысячи ","тысяч ");
  if(rest)s+=tri(rest,false);
  s=s.replace(/\s+$/,"");
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function sumToWords(v){
  v=Math.round((+v||0)*100)/100;
  var rub=Math.floor(v), kop=Math.round((v-rub)*100);
  if(kop>99){rub+=1;kop=0;}
  return numToWordsRu(rub)+" "+plural(rub,"рубль","рубля","рублей")+" "+(kop<10?"0":"")+kop+" "+plural(kop,"копейка","копейки","копеек");
}

function toast(msg,type){
  var t=document.createElement("div");t.className="toast "+(type||"");t.textContent=msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(function(){t.classList.add("out");setTimeout(function(){t.remove();},350);},4200);
}
function runCounts(scope){
  var els=scope.querySelectorAll("[data-count]");
  for(var q=0;q<els.length;q++)(function(el){
    var target=parseFloat(el.getAttribute("data-count"))||0,dur=750,t0=performance.now(),money=el.getAttribute("data-money")==="1";
    function step(t){var k=Math.min((t-t0)/dur,1),e=1-Math.pow(1-k,3),v=target*e;
      el.textContent=money?fmt(v):fnum(v); if(k<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  })(els[q]);
}

function compressImage(file, maxDim, quality, cb){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.width,h=img.height;
        var scale=Math.min(1, maxDim/Math.max(w,h));
        var nw=Math.max(1,Math.round(w*scale)), nh=Math.max(1,Math.round(h*scale));
        var c=document.createElement("canvas"); c.width=nw; c.height=nh;
        c.getContext("2d").drawImage(img,0,0,nw,nh);
        cb(c.toDataURL("image/jpeg",quality));
      }catch(e){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=rd.result;
  };
  rd.onerror=function(){ cb(null); };
  rd.readAsDataURL(file);
}
var PH_CUR=null;
function photosOf(obj){ return obj.photos||[]; }
function photosModal(obj,title,withTags){
  PH_CUR={obj:obj,title:title,withTags:withTags};
  var ph=photosOf(obj);
  var body;
  if(ph.length){
    body='<div class="ph-grid">'+ph.map(function(p){
      return '<div class="ph-item"><img src="'+p.data+'">'
        +(p.tag?'<span class="ph-tag">'+esc(p.tag)+'</span>':'')
        +'<button class="ph-del" data-act="ph-del" data-id="'+p.id+'">✕</button></div>';
    }).join("")+'</div>';
  }else{
    body='<div class="exp-empty"><div class="e-ic">📷</div><div>Фото пока нет. Добавьте «до/после» — они сожмутся автоматически.</div></div>';
  }
  openModal('<h3>📷 '+esc(title)+'</h3>'
    +body
    +'<div class="fgrid" style="margin-top:14px">'
    +(withTags?'<div><label>Отметка</label><select class="inp" id="phTag"><option value="до">До</option><option value="после">После</option><option value="фото">Фото</option></select></div>':'')
    +'<div><label>Добавить фото (сжатие автоматически)</label><input type="file" id="phFile" accept="image/*" multiple style="font-size:12px;color:var(--dim)"></div>'
    +'</div>'
    +'<div class="modal-foot"><button class="btn btn-ghost" data-act="close">Закрыть</button></div>');
  var fi=document.getElementById("phFile");
  if(fi) fi.addEventListener("change",function(){
    var files=Array.prototype.slice.call(fi.files||[]);
    if(!files.length)return;
    var tagEl=document.getElementById("phTag");
    var tag=tagEl?tagEl.value:"фото";
    var pending=files.length, added=0;
    files.forEach(function(f){
      compressImage(f,1000,0.7,function(data){
        pending--;
        if(data){ obj.photos=obj.photos||[]; obj.photos.push({id:uid(),data:data,tag:(withTags?tag:"фото"),date:today()}); added++; }
        if(pending===0){ save(); photosModal(obj,title,withTags); toast(added?("Фото добавлены: "+added):"Не удалось прочитать фото","ok"); }
      });
    });
  });
}
function photosHtmlArr(ph){
  if(!ph||!ph.length) return "";
  var out="";
  ["до","после","фото"].forEach(function(tag){
    var group=ph.filter(function(p){return (p.tag||"фото")===tag;});
    if(!group.length) return;
    var label = tag==="до"?"Фото «до»": tag==="после"?"Фото «после»":"Фото";
    out+='<p style="margin:10px 0 4px;font-weight:700">'+label+'</p>'
      +'<div class="doc-photos">'+group.map(function(p){return '<img src="'+p.data+'">';}).join("")+'</div>';
  });
  return out;
}

function suggest(text){
  var s=String(text||"").toLowerCase(); if(s.trim().length<3) return null;
  var best=null,bestScore=0;
  for(var i=0;i<KB.length;i++){var e=KB[i],score=0;
    for(var k=0;k<e.kw.length;k++){ if(s.indexOf(e.kw[k])!==-1) score+=e.kw[k].length; }
    if(score>bestScore){bestScore=score;best=e;} }
  return best;
}

function donutSvg(parts,total){
  var C=2*Math.PI*42, off=0, segs="";
  for(var i=0;i<parts.length;i++){
    var len=Math.max(parts[i].v/total*C,2);
    segs+='<circle r="42" cx="60" cy="60" fill="none" stroke="'+parts[i].color+'" stroke-width="19" stroke-dasharray="'+Math.max(len-2.5,0.5)+' '+(C-len+2.5)+'" stroke-dashoffset="'+(-off)+'"></circle>';
    off+=len;
  }
  return '<svg viewBox="0 0 120 120" class="donut">'+segs+'</svg>';
}
function lineSvg(vals){
  var w=560,h=130,pad=8,max=Math.max.apply(null,vals.concat([1]));
  var pts=vals.map(function(v,i){ return [pad+i*(w-2*pad)/(vals.length-1), h-pad-(v/max)*(h-2*pad)]; });
  var line=pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var area="M"+pts[0][0]+","+(h-pad)+" L"+line.replace(/ /g," L")+" L"+pts[pts.length-1][0]+","+(h-pad)+" Z";
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:130px;display:block" preserveAspectRatio="none">'
    +'<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c445" stop-opacity=".22"/><stop offset="1" stop-color="#f6c445" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#lg)"/><polyline points="'+line+'" fill="none" stroke="#f6c445" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function bindVideoSwitch(){
  var vs=document.getElementById("videoSwitch");

}

function clientsHtml(){
  var map={};
  (state.clients||[]).forEach(function(c){ map[c.name]={client:c,projects:[]}; });
  state.projects.forEach(function(p){ var key=(p.client||"").trim()||"Без клиента"; if(!map[key])map[key]={client:null,projects:[]}; map[key].projects.push(p); });
  var keys=Object.keys(map).sort();
  if(!keys.length) return '<div class="empty"><b>Клиентов пока нет</b>Добавьте клиента — и заводите на него объекты и сметы одной кнопкой.</div>';
  return keys.map(function(k){
    var entry=map[k], ps=entry.projects, c=entry.client;
    var phone=c?c.phone:""; if(!phone) ps.some(function(p){ if(p.phone){phone=p.phone;return true;} return false;});
    var addr=c?c.address:""; if(!addr) ps.some(function(p){ if(p.address){addr=p.address;return true;} return false;});
    var tot=ps.reduce(function(s,p){return s+projTotal(p);},0);
    var paid=ps.reduce(function(s,p){return s+paidOf(p.id);},0);
    var debt=ps.reduce(function(s,p){return s+debtOf(p);},0);
    var hist=ps.map(function(p){
      return '<div class="pitem" data-act="open-est" data-id="'+p.id+'"><div class="mid"><div class="nm">'+esc(p.name)+'</div><div class="sb">'+TYPE_L[p.type]+' · '+STAT_L[p.status]+'</div></div><div class="sum">'+fmt(projTotal(p))+'</div><span class="go">›</span></div>';
    }).join("");
    return '<div class="card" style="margin-bottom:14px"><div class="card-h"><b>👤 '+esc(k)+'</b>'
      +'<span style="display:flex;gap:6px;flex-wrap:wrap">'
      +(phone?'<a class="btn btn-cyan btn-sm" style="text-decoration:none" href="tel:'+esc(phone.replace(/[^+\d]/g,""))+'">📞</a>':"")
      +'<button class="btn btn-amber btn-sm" data-act="client-to-project" data-name="'+esc(k)+'" data-phone="'+esc(phone||"")+'" data-address="'+esc(addr||"")+'">＋ Объект и смета</button>'
      +(c?'<button class="btn btn-ghost btn-sm" data-act="client-edit" data-id="'+c.id+'">✎</button>':'')
      +(c?'<button class="del-txt" data-act="del-client" data-id="'+c.id+'">Удалить</button>':'')
      +'</span></div>'
      +'<div class="fin-tot no-line"><div><div class="k">Объектов</div><div class="v">'+ps.length+'</div></div><div><div class="k">На сумму</div><div class="v">'+fmt(tot)+'</div></div><div><div class="k">Оплачено</div><div class="v" style="color:var(--green)">'+fmt(paid)+'</div></div><div><div class="k">Долг</div><div class="v" style="color:'+(debt>0.5?"var(--red)":"var(--green)")+'">'+fmt(debt)+'</div></div></div>'
      +(ps.length? '<div style="font-size:11px;color:var(--dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.07em">История объектов</div>'+hist : '<div style="color:var(--dim);font-size:13px">Объектов пока нет — заведите первой кнопкой.</div>')
      +'</div>';
  }).join("");
}

function parseImportText(text,mode){
  var rows=[];
  var lines=String(text).split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s.length;});
  if(!lines.length) return rows;
  var delim=detectDelim(lines[0]);
  var cellsArr=lines.map(function(l){return parseLine(l,delim);});
  if(cellsArr.length){
    var head=cellsArr[0].join(" ").toLowerCase();
    var lastNum=toNum(cellsArr[0][cellsArr[0].length-1]);
    if(lastNum==null&&/наим|цен|стоим|катег|кол|ед\b/.test(head)) cellsArr.shift();
  }
  cellsArr.forEach(function(cells){
    if(cells.length<2) return;
    var name=cells[0]; if(!name) return;
    var price=toNum(cells[cells.length-1]); if(price==null) return;
    var unit="шт.", cat="", qty=1, trade="";
    if(mode==="price"){
      if(cells.length===3){ unit=cells[1]||"шт."; }
      else if(cells.length===4){ cat=cells[1]; unit=cells[2]||"шт."; }
      else if(cells.length>=5){ cat=cells[1]; unit=cells[2]||"шт."; trade=normTrade(cells[4]); }
    }else{
      if(cells.length===3){ qty=toNum(cells[1])||1; }
      else if(cells.length>=4){ unit=cells[1]||"шт."; qty=toNum(cells[2])||1; }
    }
    rows.push({name:name,cat:cat,unit:unit,price:price,qty:qty,trade:trade});
  });
  return rows;
}
function toNum(s){
  if(s==null)return null;
  var t=String(s).replace(/\s/g,"").replace(/руб\.?/i,"");
  if(!t)return null;
  if(/^-?\d+([.,]\d+)?$/.test(t)) return parseFloat(t.replace(",","."));
  return null;
}
function detectDelim(row){
  var t=(row.match(/\t/g)||[]).length, s=(row.match(/;/g)||[]).length, c=(row.match(/,/g)||[]).length;
  if(t>=s&&t>=c) return t>0?"\t":(s>0?";":",");
  if(s>=c) return ";";
  return ",";
}
function parseLine(line,delim){
  var out=[],cur="",inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===delim){out.push(cur);cur="";}
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(function(x){return x.trim();});
}
function normTrade(s){
  s=String(s||"").toLowerCase();
  if(/видео|video|скт/.test(s))return "video";
  if(/оба|both|все|всё/.test(s))return "both";
  if(/элек|электро/.test(s))return "elektro";
  return "";
}

function recModal(rec,siteId){
  function v(k){ return rec?esc(rec[k]||""):""; }
  function sel(obj,cur){ return Object.entries(obj).map(function(e){ return '<option value="'+e[0]+'" '+(cur===e[0]?"selected":"")+'>'+e[1]+'</option>'; }).join(""); }
  openModal('<h3>'+(rec?"Запись журнала":"Регистрация дефекта / неисправности")+'</h3>'

  +'<div><label>Категория</label><select class="inp" name="cat">'+sel(CAT_L,rec?rec.cat:"defect")+'</select></div>'
  +'<div><label>Локация на объекте</label><input class="inp" name="loc" value="'+v("loc")+'" placeholder="Где обнаружено"></div>'
  +'<div><label>Критичность</label><select class="inp" name="sev">'+sel(SEV_L,rec?rec.sev:"mid")+'</select></div>'
  +'<div><label>Статус</label><select class="inp" name="status">'+sel(JST_L,rec?rec.status:"new")+'</select></div>'
  +'<div><label>Исполнитель</label><input class="inp" name="executor" value="'+v("executor")+'" placeholder="ФИО"></div>'
  +'<div><label>Дата устранения</label><input class="inp" type="date" name="doneDate" value="'+v("doneDate")+'"></div>'
  +'<div></div>'
  +'<div class="full"><label>Решение / рекомендуемые мероприятия</label><textarea class="inp" name="fix" rows="5" placeholder="Подберите автоматически или введите вручную…"></textarea>'
  +'<input type="hidden" name="fixAuto" value="'+(rec&&rec.fix?0:1)+'"></div>'
  +'</div><div id="kbHint"></div>'
  +'<div class="modal-foot"><button type="button" class="btn btn-cyan" data-act="kb-suggest" style="margin-right:auto">⚙ Подобрать решение</button>'
  +'<button type="button" class="btn btn-ghost" data-act="close">Отмена</button><button type="submit" class="btn btn-amber">Сохранить</button></div></form>');
  var f=document.getElementById("recForm");
  if(rec){ f.name.value=rec.name||""; f.fix.value=rec.fix||""; }
  setKbHint(rec&&rec.fix?suggest(rec.name):null, !!(rec&&rec.fix&&!suggest(rec.name)));
  var tmr;
  f.name.addEventListener("input",function(){
    clearTimeout(tmr);
    tmr=setTimeout(function(){
      var m=suggest(f.name.value); setKbHint(m,false);
      if(m&&f.fixAuto.value==="1"&&!f.fix.value.trim()) f.fix.value=m.s;
    },350);
  });
  f.fix.addEventListener("input",function(){ f.fixAuto.value="0"; });
  setTimeout(function(){ f.name.focus(); },60);
}
function setKbHint(m,manual){
  var h=document.getElementById("kbHint"); if(!h)return;
  if(m){ h.innerHTML='<div class="kbanne">⚙ <span><b>База знаний:</b> '+esc(m.t)+(m.ref?' · <i>'+esc(m.ref)+'</i>':"")+' — решение подставлено автоматически, при необходимости отредактируйте.</span></div>'; }
  else if(manual){ h.innerHTML='<div class="kbanne none">Решение задано вручную.</div>'; }
  else h.innerHTML="";
}

function openPrintWindow(html){

  if(!w){ toast("Браузер заблокировал окно печати. Разрешите всплывающие окна и повторите.","err"); return; }
  w.document.open();
  w.document.write('<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Печать</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Golos+Text:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">'
    +'<style>'+PRINT_CSS+'</style></head><body>'+html+'</body></html>');

}
var CDN={
  jspdf:["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"],
  html2canvas:["https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js","https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"]
};
var libPromises={};
function loadScript(url){ return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=url; s.onload=res; s.onerror=function(){rej(new Error(url));}; document.head.appendChild(s); }); }
function loadLib(name){
  if(name==="jspdf"&&window.jspdf) return Promise.resolve(true);
  if(name==="html2canvas"&&window.html2canvas) return Promise.resolve(true);
  if(!libPromises[name]){
    libPromises[name]=(async function(){ for(var i=0;i<CDN[name].length;i++){ try{ await loadScript(CDN[name][i]); return true; }catch(e){} } return false; })();
  }
  return libPromises[name];
}
async function ensurePdfLibs(){
  toast("Загружаю модули PDF (нужен интернет)…");
  var r=await Promise.all([loadLib("jspdf"),loadLib("html2canvas")]);
  return !!(r[0]&&r[1]&&window.jspdf&&window.html2canvas);
}
async function exportPdf(html,filename){
  var ok=false;
  try{ ok=await ensurePdfLibs(); }catch(e){ ok=false; }
  if(!ok){ toast("PDF-модули недоступны. Открываю печать — выберите «Сохранить как PDF».","err"); printHtml(html); return; }
  try{
    if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    var src=document.getElementById("pdfSource");
    src.innerHTML='<div style="background:#fff;padding:12px;display:inline-block">'+html+'</div>';
    var canvas=await html2canvas(src.firstElementChild,{scale:2,backgroundColor:"#ffffff",logging:false,scrollX:0,scrollY:0});
    src.innerHTML="";
    var jsPDF=window.jspdf.jsPDF, pdf=new jsPDF("p","mm","a4");
    var mmW=210-16,mmH=297-16,pxPerMm=canvas.width/mmW,pagePx=Math.floor(mmH*pxPerMm);
    var y=0,page=0;
    while(y<canvas.height){
      var sliceH=Math.min(pagePx,canvas.height-y);
      var c2=document.createElement("canvas"); c2.width=canvas.width; c2.height=sliceH;
      c2.getContext("2d").drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
      if(page>0)pdf.addPage();
      pdf.addImage(c2.toDataURL("image/jpeg",0.92),"JPEG",8,8,mmW,sliceH/pxPerMm);
      y+=sliceH; page++;
    }
    pdf.save(filename); toast("PDF сохранён","ok");
  }catch(err){
    toast("Ошибка генерации PDF — открываю окно печати","err"); openPrintWindow(html);
  }finally{ document.getElementById("pdfSource").innerHTML=""; }
}
function downloadBlob(blob,name){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}
function exportXlsx(aoa,filename,sheetName){
  try{
    function escXml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
    var sheet=String(sheetName||"Лист1").replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31);
    var cols=1; aoa.forEach(function(r){ if(r.length>cols)cols=r.length; });
    var colsXml="";
    for(var c=0;c<cols;c++){ var w=60; aoa.forEach(function(r){ var v=String(r[c]==null?"":r[c]); if(v.length*7+14>w)w=v.length*7+14; }); colsXml+='<Column ss:Width="'+Math.min(w,420)+'"/>'; }
    var rowsXml=aoa.map(function(row){
      return '<Row>'+row.map(function(cell){
        if(typeof cell==="number"&&isFinite(cell)) return '<Cell><Data ss:Type="Number">'+cell+'</Data></Cell>';
        return '<Cell><Data ss:Type="String">'+escXml(cell)+'</Data></Cell>';
      }).join("")+'</Row>';
    }).join("");
    var xml='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'
      +'<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
      +'<Worksheet ss:Name="'+escXml(sheet)+'"><Table>'+colsXml+rowsXml+'</Table></Worksheet></Workbook>';
    downloadBlob(new Blob([xml],{type:"application/vnd.ms-excel;charset=utf-8"}),filename);
    toast("Файл Excel сохранён","ok");
  }catch(e){ toast("Ошибка формирования Excel","err"); }
}

    var est=estOf(ui.projectId), r=est.rows.find(function(x){return x.id===erow.getAttribute("data-eid");});
    if(r){
      var f=t.getAttribute("data-f");
      r[f]=(f==="qty"||f==="price")?(+t.value||0):t.value;
      var cell=erow.querySelector("[data-sum]");
      if(cell)cell.textContent=fmt((+r.qty||0)*(+r.price||0));
      if(f==="kind")erow.className="kind-"+r.kind;
      updateEstFoot(); save();
    }
    return;
  }
  if(t.id==="estDisc"){ var e1=estOf(ui.projectId); e1.discount=Math.min(Math.max(+t.value||0,0),90); updateEstFoot(); save(); return; }
  if(t.id==="estK"){ var e2=estOf(ui.projectId); e2.regionK=Math.min(Math.max(+t.value||1,0.1),5); updateEstFoot(); save(); return; }
  if(t.id==="estNote"){ estOf(ui.projectId).note=t.value; save(); return; }
  var drow=t.closest("tr[data-did]");
  if(drow&&t.getAttribute("data-f")){
    var d=state.defects.find(function(x){return x.id===drow.getAttribute("data-did");});
    if(d){ d[t.getAttribute("data-f")]=t.getAttribute("data-f")==="qty"?(+t.value||0):t.value; save(); renderBadges(); }
    return;
  }
  var prow=t.closest("tr[data-pid]");
  if(prow&&t.getAttribute("data-f")){
    var i=state.pricelist.find(function(x){return x.id===prow.getAttribute("data-pid");});
    if(i){ i[t.getAttribute("data-f")]=t.getAttribute("data-f")==="price"?(+t.value||0):t.value; save(); }
    return;
  }
});
document.addEventListener("submit",function(e){

  if(f.id==="projForm"){
    e.preventDefault();
    var data=Object.fromEntries(new FormData(f).entries()), id=f.getAttribute("data-id");
    if(id){ Object.assign(projOf(id),data); toast("Проект обновлён","ok"); }
    else{
      var nt=0; state.projects.forEach(function(p){ if((p.ts||0)>nt)nt=p.ts||0; });
      data.id=uid(); data.createdAt=today(); data.ts=nt+1; data.photos=[];
      state.projects.push(data);
      ui.projectId=data.id;
      toast("Проект создан","ok");
    }
    save(); closeModal(); renderBadges(); go("projects");
  }
  if(f.id==="clientForm"){
    e.preventDefault();
    var d0=Object.fromEntries(new FormData(f).entries()), id0=f.getAttribute("data-id");
    if(id0){ var c0=clientOf(id0); if(c0){c0.name=d0.name;c0.phone=d0.phone;c0.address=d0.address;c0.note=d0.note;} toast("Клиент обновлён","ok"); }
    else{ state.clients=state.clients||[]; state.clients.push({id:uid(),name:d0.name,phone:d0.phone,address:d0.address,note:d0.note}); toast("Клиент добавлен","ok"); }

    e.preventDefault();
    var d2=new FormData(f), pid2=f.getAttribute("data-pid");

    save(); expensesModal(pid2); renderCurrent(); toast("Расход добавлен","ok");
  }
  if(f.id==="siteForm"){
    e.preventDefault();
    var data2=Object.fromEntries(new FormData(f).entries()), id2=f.getAttribute("data-id");
    if(id2){ Object.assign(siteOf(id2),data2); toast("Объект обновлён","ok"); }
    else{
      var nt2=0; state.sites.forEach(function(s){ if((s.ts||0)>nt2)nt2=s.ts||0; });
      data2.id=uid(); data2.createdAt=today(); data2.ts=nt2+1;
      state.sites.push(data2);
      ui.siteId=data2.id; ui.defMode="journal"; toast("Объект создан","ok");
    }
    save(); closeModal(); renderBadges(); renderDefects();
  }
  if(f.id==="recForm"){
    e.preventDefault();
    var data3=Object.fromEntries(new FormData(f).entries());
    data3.fix=normNums(data3.fix||"");
    data3.fixAuto=data3.fixAuto==="1";
    var id3=f.getAttribute("data-id");
    if(id3){ Object.assign(recOf(id3),data3); toast("Запись обновлена","ok"); }
    else{
      data3.id=uid();
      data3.siteId=f.getAttribute("data-site")||ui.siteId;
      if(!data3.executor) data3.executor="";
      if(!data3.doneDate) data3.doneDate="";
      data3.photos=[];
      state.journal.push(data3);
      toast("Запись добавлена в журнал объекта","ok");
    }
    save(); closeModal(); renderBadges(); renderDefects();
  }
  if(f.id==="priceForm"){
    e.preventDefault();
    var d3=new FormData(f);
    state.pricelist.push({id:uid(),name:d3.get("name"),cat:d3.get("cat")||"",unit:d3.get("unit")||"шт.",price:+d3.get("price")||0,kind:ui.priceKind,trade:d3.get("trade")||"elektro"});
    save(); renderPrice(); toast("Позиция добавлена в прайс","ok");
  }
  if(f.id==="setForm"){

    var d4=new FormData(f);
    state.profile=Object.assign(state.profile||{},{

    });

    toast("Настройки сохранены","ok");
  }
  if(f.id==="docsForm"){
    e.preventDefault();
    var d5=new FormData(f);
    state.profile=Object.assign(state.profile||{},{
      showLogo:d5.get("showLogo")==="on",

      showClientDoc:d5.get("showClientDoc")==="on",

      tblStyle:d5.get("tblStyle")||"grid",
      showWords:d5.get("showWords")==="on",
      showNds:d5.get("showNds")==="on",
      ndsText:String(d5.get("ndsText")||"").trim()||"НДС не облагается",
      sigExecLabel:String(d5.get("sigExecLabel")||"").trim(),
      sigClientLabel:String(d5.get("sigClientLabel")||"").trim(),
      footerText:String(d5.get("footerText")||"").trim()
    });
    save(); toast("Оформление документов сохранено","ok");
  }
});

document.getElementById("importFile").addEventListener("change",function(e){
  var file=e.target.files[0]; if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var obj=JSON.parse(rd.result);
      if(!obj||!Array.isArray(obj.projects))throw 0;
      state={projects:obj.projects,estimates:obj.estimates||{},defects:obj.defects||[],pricelist:obj.pricelist||[],sites:obj.sites||[],journal:obj.journal||[],
        payments:obj.payments||[],expenses:obj.expenses||[],clients:obj.clients||[],profile:Object.assign({},DEF_PROFILE,obj.profile||{})};
      (state.projects||[]).forEach(function(p){ p.photos=p.photos||[]; });
      (state.defects||[]).forEach(function(d){ d.photos=d.photos||[]; });
      (state.journal||[]).forEach(function(r){ r.photos=r.photos||[]; });
      (state.pricelist||[]).forEach(function(i){ if(!i.trade){ i.trade = i.kind==="work" ? (i.cat==="Видеонаблюдение"?"video":"elektro") : ((i.cat==="Видеонаблюдение"||/FTP|cat5e|UTP/i.test(i.name))?"video":"elektro"); }});
      Object.values(state.estimates||{}).forEach(function(est){ (est.rows||[]).forEach(function(rw){ if(!rw.trade){
        var pi=state.pricelist.find(function(x){return x.name===rw.name;});
        rw.trade=(pi&&pi.trade==="video")?"video":"elektro";
      }});});
      ui.projectId=null; ui.siteId=null; applyTheme(); save(); renderBadges(); go(ui.section); toast("Данные импортированы","ok");
    }catch(err){ toast("Ошибка: неверный файл резервной копии","err"); }
  };
  rd.readAsText(file); e.target.value="";
});
document.getElementById("overlay").addEventListener("mousedown",function(e){ if(e.target.id==="overlay")closeModal(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeModal(); document.getElementById("menu").classList.remove("on"); } });

function boot(){ applyTheme(); renderDash(); renderBadges(); }
try{ boot(); window.PULT_OK=true; }catch(e){ window.PULT_ERR=String(e&&e.message||e); }
window.addEventListener("load",function(){
  try{ if(!document.getElementById("view-dash").innerHTML.trim()){ boot(); } window.PULT_OK=true; }catch(e){ window.PULT_ERR=String(e&&e.message||e); }
});
</script>
